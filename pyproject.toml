[project]
name = "planka-mcp"
version = "0.1.0"
description = "MCP server for Planka project management"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.3",
    "httpx>=0.28.1",
]

[project.scripts]
planka-mcp = "planka_mcp.server:main"

[tool.hatch.build]
packages = ["src/planka_mcp"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
