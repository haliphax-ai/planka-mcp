[project]
name = "planka-mcp"
version = "0.1.0"
description = "MCP server for Planka project management"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.3",
    "httpx>=0.28.1",
]

[project.scripts]
planka-mcp = "planka_mcp.server:main"

[tool.hatch.build]
packages = ["src/planka_mcp"]

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "ty>=0.0.79",
]
